<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
        --violet: #8b5cf6;
        --glow: rgba(150, 110, 255, 0.18);
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #ffffff;
        --subtle: #f6f8fa;
        --border: #d0d7de;
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root { --fg: #e6edf3; --muted: #8b949e; --bg: #0d1117; --subtle: #161b22; --border: #30363d; }
      }
      * { box-sizing: border-box; }
      body {
        width: 340px; margin: 0; padding: 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: var(--fg); background: var(--bg);
      }

      /* header */
      .head { display: flex; align-items: center; gap: 9px; margin-bottom: 3px; }
      .tile {
        width: 24px; height: 24px; flex: none; display: flex; align-items: center; justify-content: center;
        border-radius: 7px; background: var(--glow); box-shadow: 0 0 14px var(--glow);
      }
      .tile svg { width: 15px; height: 15px; display: block; }
      .wordmark { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; }
      .sub { margin: 0 0 14px; color: var(--muted); font-size: 12px; }

      /* form */
      .lbl {
        display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--muted); margin: 12px 0 4px;
      }
      input[type="text"] {
        width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 7px;
        background: transparent; color: inherit; font: inherit; transition: box-shadow 0.12s, border-color 0.12s;
      }
      input[type="text"]::placeholder { color: var(--muted); opacity: 0.7; }
      input#token, input#slug, input#repo { font-family: var(--mono); font-size: 12px; }
      input[type="text"]:focus {
        outline: none; border-color: var(--violet); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22);
      }

      /* segmented mode toggle */
      .modes {
        display: flex; margin: 12px 0 4px; padding: 3px; gap: 3px;
        background: var(--subtle); border: 1px solid var(--border); border-radius: 8px;
      }
      .modes label {
        flex: 1; text-align: center; padding: 5px 0; border-radius: 5px; cursor: pointer;
        font-size: 12px; color: var(--muted); transition: background 0.12s, color 0.12s;
      }
      .modes input { position: absolute; opacity: 0; pointer-events: none; }
      .modes label:has(input:checked) { background: var(--bg); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
      .modes label:has(input:focus-visible) { outline: 2px solid var(--violet); outline-offset: 1px; }

      button.primary {
        margin-top: 12px; width: 100%; padding: 8px; border: 0; border-radius: 7px;
        background: var(--violet); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
        transition: filter 0.12s;
      }
      button.primary:hover { filter: brightness(1.08); }
      button.primary:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
      .hint { font-size: 11px; color: var(--muted); margin: 9px 0 0; }
      .hint a { color: var(--violet); text-decoration: none; }
      .hint a:hover { text-decoration: underline; }

      /* linked repos */
      h2 { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 18px 0 4px; font-weight: 600; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border); }
      li .repo { font-family: var(--mono); font-size: 12px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      li .badge {
        font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
        padding: 2px 6px; border-radius: 999px; background: var(--glow); color: var(--violet);
      }
      li .del { background: none; border: 0; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 2px 4px; }
      li .del:hover { color: #cf222e; }
      .empty { color: var(--muted); font-size: 12px; padding: 8px 0; }
    </style>
  </head>

      <span class="wordmark">Qualflare</span>
    </div>
    <p class="sub">Test health on your GitHub pull requests.</p>

    <form id="add">
      <label class="lbl" for="repo">GitHub repo</label>
      <input id="repo" name="repo" type="text" placeholder="owner/name" autocomplete="off" required />

      <div class="modes">
        <label><input type="radio" name="mode" value="token" checked /> Private (token)</label>
        <label><input type="radio" name="mode" value="public" /> Public (slug)</label>
      </div>

      <div id="tokenRow">
        <label class="lbl" for="token">Qualflare API token</label>
        <input id="token" name="token" type="text" placeholder="qf_…" autocomplete="off" />
      </div>
      <div id="slugRow" hidden>
        <label class="lbl" for="slug">Public project slug</label>
        <input id="slug" name="slug" type="text" placeholder="my-project" autocomplete="off" />
      </div>

      <button type="submit" class="primary">Link repo</button>
      <p class="hint">Get a token in <a href="https://app.qualflare.com" target="_blank" rel="noopener">app.qualflare.com</a> → Project → Settings → Access Tokens.</p>
    </form>

    <h2>Linked repos</h2>
    <ul id="list"><li class="empty">No repos linked yet — add one above.</li></ul>

    <script src="popup.js"></script>
  </body>
</html>
